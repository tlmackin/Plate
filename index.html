<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plate</title>
  <meta name="description" content="Private food and macro log">
  <meta name="theme-color" content="#f3f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c1312" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Plate">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="view" class="view"></main>

  <nav class="tabs" aria-label="Main">
    <button data-tab="diary" class="tab active"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M9 9h6M9 13h6"/></svg><span>Diary</span></button>
    <button data-tab="foods" class="tab"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>Foods</span></button>
    <button data-tab="add" class="tab tab-add" aria-label="Add food"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="friends" class="tab"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c1.8.8 3 2.8 3 5.6"/></svg><span>Friends</span><i class="tab-dot" id="friends-dot" hidden></i></button>
    <button data-tab="report" class="tab"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Report</span></button>
    <button data-tab="settings" class="tab"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></button>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="lib/supabase.js" defer></script>
  <script src="config.js" defer></script>
  <script src="lib/html5-qrcode.min.js" defer></script>
  <script src="lib/jspdf.umd.min.js" defer></script>
  <script src="lib/jspdf.plugin.autotable.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
